# Local development stack. Production runs from boma/infrastructure/docker.
services:
  api:
    build: .
    command: flask --app run run --host=0.0.0.0 --port=8000 --debug
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis

  celery:
    build: .
    command: celery -A run.celery worker --loglevel=info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - redis

  celery-beat:
    build: .
    command: celery -A run.celery beat --loglevel=info --schedule /tmp/celerybeat-schedule
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - redis

  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: boma
      POSTGRES_PASSWORD: boma
      POSTGRES_DB: boma
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
