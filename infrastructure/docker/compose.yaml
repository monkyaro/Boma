# BOMA production stack on the EC2 host (/opt/boma). Deployed by scripts/deploy.sh.
# PostgreSQL is RDS (databases "boma" and "keycloak"); nothing here publishes a port except nginx.
# Secrets come from Secrets Manager, written to .env / *.env by scripts/render-secrets.py (never committed).
# Compose variables (.env): REGISTRY, API_TAG, WEB_TAG, REDIS_PASSWORD.

name: boma

x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: awslogs
    options:
      awslogs-group: /boma/production/containers
      tag: "{{.Name}}" # log stream per container
      mode: non-blocking
      max-buffer-size: 4m

x-backend: &backend
  <<: *defaults
  image: ${REGISTRY}/boma/api:${API_TAG:?API_TAG not set}
  env_file: api.env
  networks: [internal]
  depends_on:
    redis:
      condition: service_healthy

services:
  nginx:
    <<: *defaults
    image: nginx:1.28-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - letsencrypt:/etc/letsencrypt:ro
      - acme:/var/www/acme:ro
    # Reload every 6h so renewed certificates are picked up.
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks: [edge, internal]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128m }

  certbot:
    <<: *defaults
    image: certbot/certbot:v4.2.0
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme:/var/www/acme
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/acme --quiet; sleep 12h & wait $${!}; done"]
    networks: [edge]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128m }

  web:
    <<: *defaults
    image: ${REGISTRY}/boma/web:${WEB_TAG:?WEB_TAG not set}
    environment:
      API_INTERNAL_URL: http://api:8000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 512m }

  api:
    <<: *backend
    environment:
      GUNICORN_WORKERS: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s # runs migrations first
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1g }

  celery-worker:
    <<: *backend
    command: ["celery", "-A", "run.celery", "worker", "--loglevel=info", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A run.celery inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 768m }

  celery-beat:
    <<: *backend
    command: ["celery", "-A", "run.celery", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256m }

  # Keycloak account emails (verify email, reset password) go to this relay over plain SMTP on the
  # internal network; it sends with the SES API using the instance role (no SMTP keys).
  mail-relay:
    <<: *defaults
    image: ${REGISTRY}/boma/api:${API_TAG:?API_TAG not set}
    command: ["python", "/relay/ses_relay.py"]
    environment:
      AWS_REGION: eu-west-1
      RELAY_FROM_DOMAIN: bomahoop.com
    volumes:
      - ./mail-relay/ses_relay.py:/relay/ses_relay.py:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 2525), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128m }

  keycloak:
    <<: *defaults
    image: quay.io/keycloak/keycloak:26.4
    command: ["start"]
    env_file: keycloak.env # KC_DB_URL, KC_DB_USERNAME, KC_DB_PASSWORD, KC_BOOTSTRAP_ADMIN_*
    environment:
      KC_DB: postgres
      KC_HOSTNAME: https://auth.bomahoop.com
      KC_HTTP_ENABLED: "true" # TLS ends at nginx
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      JAVA_OPTS_APPEND: -XX:MaxRAMPercentage=70
    volumes:
      # BOMA login theme built by the keycloak-theme workflow (theme name "boma").
      # Absolute path: deploy.sh uploads it here, outside the per-release directories.
      - /opt/boma/keycloak/providers:/opt/keycloak/providers:ro
    healthcheck:
      # Management port 9000 is only reachable inside the container network.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1536m }

  redis:
    <<: *defaults
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD not set}", "--appendonly", "no", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256m }

networks:
  edge: {}            # nginx and certbot: internet egress for ACME
  internal: {}        # app services; still has egress for S3, SES, FCM, Keycloak JWKS

volumes:
  letsencrypt: {}
  acme: {}
