user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $host "$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 25m; # API uploads; media goes straight to S3 via presigned URLs

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Docker's embedded DNS, so restarted containers are re-resolved
    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Only the non-sensitive OIDC helper/callback pages may be framed, and only by BOMA.
    map $uri $boma_x_frame_options {
        default DENY;
        /silent-check-sso.html SAMEORIGIN;
        ~^/realms/[^/]+/protocol/openid-connect/(3p-cookies/step[12]\.html|login-status-iframe\.html)$ "";
    }
    map $uri $boma_frame_policy {
        default "";
        /silent-check-sso.html "frame-ancestors 'self'";
        ~^/realms/[^/]+/protocol/openid-connect/(3p-cookies/step[12]\.html|login-status-iframe\.html)$ "frame-ancestors https://bomahoop.com https://www.bomahoop.com https://admin.bomahoop.com https://auth.bomahoop.com";
    }

    include /etc/nginx/conf.d/*.conf;
}
