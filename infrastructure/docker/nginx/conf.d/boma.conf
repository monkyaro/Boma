# Upstreams are set via variables so nginx starts even if a container is down,
# and re-resolves it after a restart (see resolver in nginx.conf).
# Header add_header lines live in snippets/tls.conf; do not add_header inside locations.

# --- Port 80: ACME challenges, local health probe, redirect everything else to HTTPS
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location = /nginx-health {
        access_log off;
        allow 127.0.0.1;
        deny all;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Reject HTTPS requests for unknown hostnames
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    include /etc/nginx/snippets/tls.conf;
    return 444;
}

# --- www -> apex
server {
    listen 443 ssl;
    http2 on;
    server_name www.bomahoop.com;
    include /etc/nginx/snippets/tls.conf;
    return 301 https://bomahoop.com$request_uri;
}

# --- Website (apex) and administrative dashboard: Next.js
server {
    listen 443 ssl;
    http2 on;
    server_name bomahoop.com admin.bomahoop.com;
    include /etc/nginx/snippets/tls.conf;

    location / {
        set $web http://web:3000;
        proxy_pass $web;
        include /etc/nginx/snippets/proxy.conf;
    }
}

# --- API: Flask-RESTX
server {
    listen 443 ssl;
    http2 on;
    server_name api.bomahoop.com;
    include /etc/nginx/snippets/tls.conf;

    location / {
        limit_req zone=api burst=40 nodelay;
        set $api http://api:8000;
        proxy_pass $api;
        include /etc/nginx/snippets/proxy.conf;
    }
}

# --- Authentication: Keycloak (only the public paths; management port 9000 is never proxied)
server {
    listen 443 ssl;
    http2 on;
    server_name auth.bomahoop.com;
    include /etc/nginx/snippets/tls.conf;

    set $keycloak http://keycloak:8080;

    location = / {
        return 302 https://bomahoop.com/;
    }

    location /realms/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass $keycloak;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /resources/ {
        proxy_pass $keycloak;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Admin console and admin REST API: open to all while bomahoop.com is a test env.
    # Before go-live, restore the IP allow list (same list as SSH in main.tf).
    location /admin/ {
        proxy_pass $keycloak;
        include /etc/nginx/snippets/proxy.conf;
    }

    location / {
        return 404;
    }
}
