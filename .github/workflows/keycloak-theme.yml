name: Keycloak theme
on:
    push:
        branches:
            - main
        paths:
            - "keycloak-theme/**"
            - ".github/workflows/keycloak-theme.yml"
    pull_request:
        paths:
            - "keycloak-theme/**"
            - ".github/workflows/keycloak-theme.yml"

defaults:
    run:
        working-directory: keycloak-theme

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: keycloak-theme/package-lock.json
            # keycloakify packages the theme with Maven
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21
            - run: npm ci
            - run: npm audit --omit=dev --audit-level=high
            - run: npm run build-keycloak-theme
            - uses: actions/upload-artifact@v4
              with:
                  name: boma-keycloak-theme
                  path: keycloak-theme/dist_keycloak/*.jar
