name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: boma
          POSTGRES_PASSWORD: boma
          POSTGRES_DB: boma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boma" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt pip-audit

      - name: Run tests
        run: python -m pytest -q

      - name: Check migrations match models
        env:
          SQLALCHEMY_DATABASE_URI: postgresql+psycopg://boma:boma@localhost:5432/boma_test
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
        run: flask --app run db upgrade && flask --app run db check

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  build:
    # Images are only published from main; deployment to EC2 is a separate,
    # approval-gated workflow in the infrastructure repo.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # GitHub OIDC -> AWS, no long-lived keys
    env:
      AWS_REGION: eu-west-1
      ECR_REPOSITORY: boma/api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # EC2 host is t4g (Graviton), so build for arm64
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          load: false
          push: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          input: /tmp/image.tar
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image
        run: |
          docker load -i /tmp/image.tar
          docker push ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
